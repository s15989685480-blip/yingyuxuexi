<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英学阶梯 · 一站式英语学习平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E6B5A'/%3E%3Cpath d='M16 20a4 4 0 0 1 4-4h24a4 4 0 0 1 4 4v28H20a4 4 0 0 0-4 4V20z' fill='%23F5EFE3'/%3E%3Cpath d='M20 24h24M20 32h16M20 40h12' stroke='%231E6B5A' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M42 36l8 5v-18l-8 5z' fill='%23DE8F2E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=Nunito:wght@500;700;800&display=swap">
<style>
/* ===== 设计令牌 ===== */
:root{
  --paper:#F5EFE3; --surface:#FFFDF7; --surface-2:#EDE5D3;
  --ink:#24312C; --ink-2:#5D6B64; --ink-3:#8A948C;
  --line:#E2D9C6; --line-2:#EFE8D8;
  --green:#1E6B5A; --green-d:#174F43; --green-soft:#DFEEE7;
  --amber:#DE8F2E; --amber-d:#B06F1D; --amber-soft:#FAEED9;
  --coral:#BC4B39; --coral-soft:#F8E4DE;
  --blue:#3D6FB4; --blue-soft:#E4EBF7;
  --violet:#7A5AA7; --violet-soft:#EDE7F6;
  --shadow:0 10px 28px rgba(36,49,44,.08);
  --radius:14px;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --num:"Nunito","Noto Sans SC",sans-serif;
  --ipa:"Nunito","Segoe UI","Arial","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber-soft)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
img{display:block} svg{display:inline-block;vertical-align:-0.125em}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
ul{list-style:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 头部导航 ===== */
.site-head{position:sticky;top:0;z-index:60;background:rgba(255,253,247,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-inner{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand .b-mark{color:var(--green)}
.main-nav{display:flex;gap:2px;margin-left:auto}
.nav-item{padding:7px 13px;border-radius:9px;font-size:14px;color:var(--ink-2);font-weight:500;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--green-soft);color:var(--green-d);font-weight:700}
.head-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);transition:background .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* ===== 课程教材导航栏 ===== */
.levelbar{background:var(--surface);border-bottom:1px solid var(--line)}
.lb-inner{max-width:1160px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:14px}
.lb-label{font-size:13px;color:var(--ink-3);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.lb-label b{color:var(--green);font-size:15px;letter-spacing:0}
.lb-list{display:flex;gap:8px;flex-wrap:wrap}
.lv-btn{display:flex;align-items:center;gap:9px;padding:8px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;font-size:14px;transition:transform .15s,border-color .15s,background .15s;box-shadow:0 1px 2px rgba(36,49,44,.04)}
.lv-btn .dot{width:9px;height:9px;border-radius:50%;flex:none}
.lv-btn small{font-weight:500;color:var(--ink-3);font-size:12px}
.lv-btn:hover{transform:translateY(-1px);border-color:var(--ink-3)}
.lv-btn.active{border-color:var(--lv);background:var(--lv-soft);color:var(--lv-d)}
.lv-btn.active small{color:var(--lv-d)}

/* ===== 布局 ===== */
.wrap{max-width:1160px;margin:0 auto;padding:30px 20px 60px}
.sec{margin-top:38px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-title{font-family:var(--serif);font-size:23px;font-weight:900}
.sec-sub{color:var(--ink-3);font-size:13px}
.grid{display:grid;gap:16px}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 21px;border-radius:12px;font-weight:700;font-size:15px;background:var(--green);color:#fff;transition:transform .15s,background .15s,box-shadow .15s;box-shadow:0 2px 6px rgba(30,107,90,.25)}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-outline{background:var(--surface);border:1.5px solid var(--green);color:var(--green);box-shadow:none}
.btn-outline:hover{background:var(--green-soft);color:var(--green-d)}
.btn-ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn-ghost:hover{background:var(--line)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:9px;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn .ico{flex:none}

/* ===== Hero ===== */
.hero{display:grid;grid-template-columns:1.22fr .78fr;gap:40px;align-items:center;padding:38px 0 16px}
.hero h1{font-family:var(--serif);font-size:clamp(30px,4.4vw,47px);line-height:1.22;font-weight:900;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--green);position:relative}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:10px;background:var(--amber-soft);z-index:-1;border-radius:4px}
.hero .sub{margin-top:16px;color:var(--ink-2);font-size:16px;max-width:54ch}
.hero-cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.stats{display:flex;gap:30px;margin-top:32px;flex-wrap:wrap;padding-top:22px;border-top:1px dashed var(--line)}
.stat b{font-family:var(--num);font-size:27px;font-weight:800;color:var(--green-d);display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-3)}
.ladder{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px 20px;box-shadow:var(--shadow)}
.ladder .l-title{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--ink-2);text-align:center;margin-bottom:18px}
.l-steps{display:flex;flex-direction:column;gap:14px;position:relative}
.l-steps::before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:2px;background:var(--line);z-index:0}
.l-step{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.l-num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:16px;color:#fff;flex:none;box-shadow:0 3px 8px rgba(36,49,44,.15)}
.l-step b{font-size:16px;font-weight:800}
.l-step span{display:block;font-size:12.5px;color:var(--ink-3)}
.l-cap{margin-top:18px;padding:11px;border-radius:12px;background:var(--amber-soft);text-align:center;font-size:13px;font-weight:600;color:var(--amber-d)}

/* ===== 学段卡片 ===== */
.lvl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1080px){.lvl-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.lvl-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.lvl-grid{grid-template-columns:1fr}}
.lvl-card{position:relative;padding:20px;overflow:hidden;cursor:pointer;transition:transform .16s,box-shadow .16s}
.lvl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lv)}
.lvl-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.lvl-card .lv-name{font-family:var(--serif);font-size:20px;font-weight:900}
.lvl-card .lv-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.lvl-card .lv-book{margin-top:12px;font-size:13px;color:var(--ink-2);padding:8px 11px;background:var(--surface-2);border-radius:9px;line-height:1.5}
.lvl-card .lv-meta{display:flex;gap:14px;margin-top:13px;font-size:12.5px;color:var(--ink-3)}
.lvl-card .lv-go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--lv-d)}
.lvl-card .lv-go .ico{transition:transform .15s}
.lvl-card:hover .lv-go .ico{transform:translateX(3px)}

/* ===== 功能磁贴 ===== */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.feat-grid{grid-template-columns:1fr}}
.feat{padding:18px;display:flex;gap:14px;align-items:flex-start;transition:transform .16s,box-shadow .16s}
.feat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.feat .f-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-d);flex:none}
.feat b{font-size:15.5px;display:block}
.feat p{font-size:13px;color:var(--ink-2);margin-top:3px}

/* ===== 时间轴 ===== */
.tl{display:grid;grid-template-columns:130px 24px 1fr;gap:0;row-gap:0}
.tl-row{display:contents}
.tl-time{align-self:center;text-align:right;font-family:var(--num);font-weight:800;font-size:16px;color:var(--lv-d);padding:14px 0}
.tl-axis{position:relative;display:flex;justify-content:center}
.tl-axis::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl-dot{align-self:center;width:14px;height:14px;border-radius:50%;background:var(--lv);justify-self:center;z-index:1;box-shadow:0 0 0 4px var(--lv-soft)}
.tl-body{align-self:center;padding:14px 0 14px 20px}
.tl-body b{font-size:16px;font-weight:800;display:block}
.tl-body span{font-size:13.5px;color:var(--ink-2);display:block;margin-top:3px}

/* ===== 通用卡片元素 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 3px rgba(36,49,44,.05)}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);flex-wrap:wrap;margin-bottom:16px}
.breadcrumb a{color:var(--green);font-weight:600}
.breadcrumb a:hover{text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:999px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);font-weight:600}
.chip.lv{color:#fff;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.amber{background:var(--amber-soft);color:var(--amber-d)}
.badge.green{background:var(--green-soft);color:var(--green-d)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.coral{background:var(--coral-soft);color:var(--coral)}

/* ===== 单元卡片 ===== */
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.unit-card{padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .16s,box-shadow .16s}
.unit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.unit-top{display:flex;align-items:center;gap:10px}
.unit-no{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--num);font-weight:800;font-size:15px;flex:none}
.unit-title{font-weight:800;font-size:15.5px;line-height:1.35}
.unit-en{font-family:var(--num);color:var(--ink-3);font-size:12.5px}
.unit-meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:12px}
.unit-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

/* ===== 词汇卡片 ===== */
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.word-card{padding:16px 16px 13px;display:flex;flex-direction:column;gap:0;transition:transform .15s,box-shadow .15s}
.word-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.w-top{display:flex;align-items:baseline;gap:9px}
.w-word{font-family:var(--num);font-size:19px;font-weight:800;letter-spacing:.01em}
.w-ipa{font-family:var(--ipa);font-size:13.5px;color:var(--ink-3)}
.w-play{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--green-soft);color:var(--green-d);display:grid;place-items:center;transition:background .15s,color .15s;flex:none}
.w-play:hover{background:var(--green);color:#fff}
.w-pos{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:8px}
.w-cn{font-size:16px;font-weight:700;color:var(--green-d);margin-top:1px}
.w-ex{font-size:13.5px;color:var(--ink-2);margin-top:9px;line-height:1.55}
.w-excn{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.w-foot{display:flex;gap:6px;margin-top:12px;border-top:1px dashed var(--line-2);padding-top:9px}
.mini-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);transition:background .15s,color .15s}
.mini-btn:hover{background:var(--line)}
.mini-btn.on{background:var(--amber-soft);color:var(--amber-d)}
.mini-btn.done{background:var(--green-soft);color:var(--green-d)}

/* ===== 句型列表 ===== */
.s-row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;align-items:center}
.s-en{font-family:var(--num);font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.s-play{width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.s-play:hover{background:var(--blue);color:#fff}
.s-cn{color:var(--ink-2);font-size:14px;margin-top:2px;grid-column:1}
.s-note{grid-column:2;grid-row:1;justify-self:end}
.s-slow{margin-left:auto}

/* ===== 语法卡 ===== */
.gram-card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#FFFDF7,#FBF4E4);padding:22px 24px}
.gram-card h3{font-family:var(--serif);font-size:19px;font-weight:900;display:flex;align-items:center;gap:9px;color:var(--amber-d)}
.gram-card h3 .g-ico{color:var(--amber)}
.pts{margin-top:12px}
.pts li{position:relative;padding-left:20px;margin:9px 0;font-size:14.5px;color:var(--ink)}
.pts li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:2px;background:var(--amber);transform:rotate(45deg)}
.g-ex{margin-top:14px;padding:13px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:11px}
.g-ex div{font-size:14px;margin:3px 0}
.g-ex .en{font-family:var(--num);font-weight:700;display:flex;gap:9px;align-items:center}
.g-ex .cn{color:var(--ink-2);font-size:13px}

/* ===== 技巧卡片 ===== */
.tip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tip-card{padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .16s,box-shadow .16s}
.tip-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tip-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--lv-soft);color:var(--lv-d)}
.tip-title{font-weight:800;font-size:15.5px;line-height:1.4}
.tip-sum{font-size:13px;color:var(--ink-2);line-height:1.6}
.tip-foot{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:12.5px;color:var(--ink-3)}

/* ===== 文章页 ===== */
.article{max-width:820px}
.article-head{padding:26px 28px;margin-bottom:20px;position:relative;overflow:hidden}
.article-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lv)}
.article-head h1{font-family:var(--serif);font-size:clamp(23px,3.4vw,31px);font-weight:900;line-height:1.3;margin-top:12px}
.article-head .tip-sum{color:var(--ink-2);font-size:14.5px;margin-top:10px;max-width:60ch}
.a-sec{margin-top:24px}
.a-sec h2{font-family:var(--serif);font-size:18px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:12px}
.a-sec h2 .n{width:26px;height:26px;border-radius:8px;background:var(--lv);color:#fff;display:grid;place-items:center;font-family:var(--num);font-size:14px;flex:none}
.a-steps{counter-reset:st}
.a-step{position:relative;padding:14px 16px 14px 52px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.a-step::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:9px;background:var(--green-soft);color:var(--green-d);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:14px}
.a-step b{font-size:14.5px}
.a-step p{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.a-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.a-card{padding:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.a-card b{font-size:14px;display:block;color:var(--lv-d)}
.a-card p{font-size:13px;color:var(--ink-2);margin-top:4px}
.a-practice{padding:16px 18px;border-radius:12px;background:var(--amber-soft);color:#6E4A12;font-size:14px;line-height:1.7}
.a-practice b{color:var(--amber-d)}
.pager{display:flex;gap:12px;margin-top:30px}

/* ===== 考试 ===== */
.ex-step{padding:22px 24px}
.ex-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ex-title{font-family:var(--serif);font-size:21px;font-weight:900}
.ex-meta{display:flex;gap:16px;margin-left:auto;color:var(--ink-2);font-size:13.5px;font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--green-d);box-shadow:0 1px 4px rgba(36,49,44,.12)}
.q-card{padding:26px 28px;margin-top:16px;min-height:220px;display:flex;flex-direction:column}
.q-type{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;align-self:flex-start}
.q-stem{font-size:17px;font-weight:700;margin-top:16px;line-height:1.6;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.q-stem .q-word{font-family:var(--num);font-size:20px;font-weight:800;color:var(--green-d)}
.q-stem .q-ipa{font-family:var(--ipa);font-size:14px;color:var(--ink-3);font-weight:500}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:20px}
@media(max-width:640px){.q-opts{grid-template-columns:1fr}}
.q-opt{padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:14.5px;font-weight:600;text-align:left;transition:border-color .15s,background .15s;display:flex;gap:11px;align-items:center}
.q-opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--num);font-size:12.5px;color:var(--ink-2);flex:none;font-weight:800}
.q-opt:hover{border-color:var(--green)}
.q-opt.sel{border-color:var(--green);background:var(--green-soft)}

.q-opt.right{border-color:var(--green);background:var(--green-soft)}
.q-opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.q-opt.dim{opacity:.55}
.q-opt .ck{width:18px;height:18px;margin-left:auto;flex:none}
.q-input{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q-input input{flex:1;min-width:200px;padding:12px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);font-size:16px;font-family:var(--num)}
.q-input input:focus{border-color:var(--green);outline:none}
.q-nav{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.ex-progress{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.ex-progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .25s}

.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}

.res-stat b{font-family:var(--num);font-size:22px;font-weight:800;display:block;color:var(--green-d)}
.res-stat span{font-size:12px;color:var(--ink-3)}
.res-grade{font-size:26px;font-weight:900;font-family:var(--serif)}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar-row .b-track{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-row .b-track i{display:block;height:100%;border-radius:999px;background:var(--green)}
.bar-row b{font-family:var(--num);font-weight:800;color:var(--ink-2);text-align:right}
.wrong-list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.wrong-item{padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wi-q{font-weight:700;font-size:14.5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.wi-a{margin-top:7px;font-size:13.5px;line-height:1.7}
.wi-a .bad{color:var(--coral);font-weight:700}
.wi-a .good{color:var(--green-d);font-weight:700}
.wi-why{margin-top:6px;font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:8px 11px;border-radius:9px}

/* ===== 词典 ===== */
.dict-search{display:flex;gap:10px;margin-bottom:18px}
.dict-search input{flex:1;padding:13px 17px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px}
.dict-search input:focus{border-color:var(--green);outline:none}
.dict-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.dict-tab{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface-2)}
.dict-tab.on{background:var(--green);color:#fff}
.dict-results{display:flex;flex-direction:column;gap:10px}
.dict-row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:15px 18px;align-items:center}
.dict-row .d-word{font-family:var(--num);font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.dict-row .d-ipa{font-family:var(--ipa);color:var(--ink-3);font-size:13px}
.dict-row .d-cn{font-weight:700;color:var(--green-d);font-size:15px}
.dict-row .d-pos{font-size:12px;color:var(--ink-3)}
.dict-row .d-ex{font-size:13.5px;color:var(--ink-2);margin-top:4px;grid-column:1}
.dict-row .d-excn{font-size:12.5px;color:var(--ink-3)}
.dict-row .d-acts{grid-column:2;grid-row:1/3;display:flex;gap:7px}

.pstat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

.modal-mask{position:fixed;inset:0;background:rgba(24,33,29,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px;animation:fade .18s}

.modal{background:var(--surface);border-radius:18px;box-shadow:0 24px 70px rgba(24,33,29,.3);width:100%;max-width:620px;max-height:88vh;overflow:auto;animation:pop .2s}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:15px 20px;display:flex;align-items:center;gap:10px;z-index:2}

.modal-body{padding:20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:all .25s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fc-word{font-family:var(--num);font-size:34px;font-weight:800;color:var(--green-d)}
.fc-ipa{font-family:var(--ipa);color:var(--ink-3);font-size:16px;margin-top:6px}
.fc-cn{font-size:24px;font-weight:800;color:var(--amber-d);margin-top:8px}
.fc-ex{font-size:15px;color:var(--ink-2);margin-top:12px;max-width:38ch}
.fc-excn{font-size:13px;color:var(--ink-3);margin-top:4px}
.fc-hint{position:absolute;top:14px;font-size:12px;color:var(--ink-3)}
.fc-acts{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.fc-prog{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:13px;color:var(--ink-2)}
.fc-track{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.fc-track i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .25s}

/* ===== 页脚 ===== */
.site-foot{border-top:1px solid var(--line);background:var(--surface);margin-top:30px}
.foot-inner{max-width:1160px;margin:0 auto;padding:24px 20px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.foot-inner a{color:var(--green);font-weight:600}

/* ===== 空态 ===== */
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.empty b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:4px}

/* ===== 响应式 ===== */
@media(min-width:901px){.levelbar{position:sticky;top:55px;z-index:55}}
@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:26px}
  .main-nav{order:3;width:100%;overflow-x:auto;padding:6px 0 2px;margin-left:0}
  .main-nav::-webkit-scrollbar{display:none}
  .lb-inner{overflow-x:auto}
  .lb-list{flex-wrap:nowrap}
  .lb-inner::-webkit-scrollbar{display:none}
}

  .wrap{padding:22px 14px 50px}

  .s-note{grid-column:1;grid-row:auto;justify-self:start}
  .ex-head{flex-direction:column;align-items:flex-start}
  .ex-meta{margin-left:0}
  .a-step{padding-left:48px}
  .tl{grid-template-columns:96px 22px 1fr}
}

  .grid{grid-template-columns:1fr!important}
}

practice:'本周选 1 首儿歌，每天听 2 遍并跟唱 1 遍，周末演给家人看。'},
{id:'pt4', tag:'听说训练', mins:5, title:'听说优先：磨耳朵的正确打开方式', summary:'儿童语言习得靠“大量输入”，听说领先，读写自然跟上。',
steps:[["固定英语时间","每天 15 分钟英语时间（早餐后或睡前），形成雷打不动的习惯。"],["可理解输入","选择 90% 能听懂的动画或儿歌，遇到生词猜意思而不是立刻查词。"],["跟读模仿","跟着原声一句一句模仿，注意语音、语调和停顿。"],["鼓励输出","鼓励孩子用英语描述看到的画面，哪怕只说一两个单词。"],["家长参与","和孩子一起学、一起说，把英语变成家庭日常。"]],
cards:[["动画选择","Peppa Pig、Dora 等语速慢、词汇日常的素材。"],["磨耳朵黄金时间","起床、餐前、睡前的碎片时间都可以利用。"],["亲子问答","看动画时用英语问 What's this?，让孩子指物回答。"]],
practice:'这周每天听同一集动画 2 遍，第 3 天开始试着跟读台词。'}
],
junior:[
{id:'jt1', tag:'音标拼读', mins:8, title:'48 音标全攻略：拼读规律与易混音', summary:'初中是系统学音标的黄金期，掌握拼读规律后，词汇记忆效率翻倍。',
steps:[["元音系统化","掌握长短元音配对：iː/ɪ、uː/ʊ、ɔː/ɒ、e/æ，长短音对照练习。"],["双元音口型滑动","eɪ、aɪ、ɔɪ、əʊ、aʊ、ɪə、eə、ʊə，发双元音时口型要“滑动”，从第一音滑向第二音。"],["清浊辅音对比","p/b、t/d、k/g、f/v、s/z、ʃ/ʒ、θ/ð 成对练习，用手摸喉部感受振动。"],["重音与弱读","双音节词重音多在第一个音节（table）；助动词、介词在句中常弱读。"],["连读与失去爆破","在句子里练 not at all、good night 等，让发音像母语者一样连贯。"]],
cards:[["易混音对","ship/sheep、bed/bad、think/sink 对比表，贴墙每天过一遍。"],["重音规律","名词重音多在前（record 作名词/动词重音不同）。"],["音标打字","用音标输入法打单词，加深音形联系。"]],
practice:'每天 10 分钟：用词典核对 5 个词的音标，大声朗读并录音对比。'},
{id:'jt2', tag:'语法框架', mins:8, title:'语法框架：先建主干再添枝叶', summary:'初中语法是骨架，先抓“时态”和“句型”两大主干，再补细节。',
steps:[["建五种基本句型","主谓、主谓宾、主系表、主谓双宾、主谓宾补，先把主干结构记牢。"],["时态时间轴","一般现在/过去/将来、现在进行、现在完成，画一条时间轴串起来。"],["从句入门","宾语从句、定语从句先学会“识别”，再学“使用”。"],["句型转换","肯定 → 否定 → 疑问三步转换，练到条件反射。"],["错题归类","每次作业错题按类型归类（时态/词性/搭配），周末重做一遍。"]],
cards:[["时态时间轴","把 5 个核心时态画在时间轴上对照复习。"],["五句型表","每天默写一次基本句型框架。"],["转换三步法","找 be/助动词 → 加 not → 提前变疑问。"]],
practice:'每周整理 10 道错题，标出错误类型，并口头给同学讲一遍解题思路。'},
{id:'jt3', tag:'词汇记忆', mins:7, title:'单词记忆：艾宾浩斯与语境双轮驱动', summary:'单词不是“背”出来的，而是按遗忘规律复习 + 在语境里使用的结果。',
steps:[["分组背词","每次 15 个左右，按主题（动物/学校/运动）或词根分组记忆。"],["音形义结合","读发音、看拼写、记含义，三个动作同时进行，缺一不可。"],["艾宾浩斯复习","第 1、2、4、7、15 天各复习一次，对抗遗忘曲线。"],["语境激活","用新词造句、朗读课文例句，让单词进入句子而不是孤立存在。"],["双向检测","遮住中文回忆英文，遮住英文回忆中文，检测才算真正记住。"]],
cards:[["5 次复习节奏","当天 → 第2天 → 第4天 → 第7天 → 第15天。"],["词根词缀","积累 un-/re-/pre-、-tion、-ful 等常见前后缀，成串记词。"],["例句库","每个新词配 1 个自己的句子，朗读 3 遍。"]],
practice:'每天背 15 个词，按 5 次复习节奏执行，周末做一次听写自测。'},
{id:'jt4', tag:'综合能力', mins:7, title:'听说读写四步闭环：从输入到输出', summary:'听说读写互相促进，四个环节形成闭环循环，才能真正“会用”英语。',
steps:[["听：精泛结合","课文精听三遍（抓大意→听细节→跟读），课外动画泛听磨耳朵。"],["说：每天开口","跟读课文、复述课文、看图说话，每天开口至少 10 分钟。"],["读：分级阅读","课外读物分级阅读，每天 10 分钟，划出生词和好句。"],["写：由抄到创","从抄写例句到看图写话，再到 80 词小短文，循序渐进。"],["四环循环","把新学的词句放进听说读写四个环节各用一次，彻底激活。"]],
cards:[["精听三遍法","第一遍抓大意，第二遍听细节，第三遍逐句跟读。"],["复述模板","时间 + 地点 + 人物 + 事件，四要素复述小故事。"],["输出日记","每周写 3 篇英语小日记，每篇 3-5 句话。"]],
practice:'本周用“精听三遍法”练 2 段课文，并用自己的话复述给家人听。'}
],
senior:[
{id:'st1', tag:'长难句', mins:9, title:'长难句拆解：三步还原主谓宾', summary:'高中阅读失分多因长难句，学会“找主干、剥修饰、看从句”三步法。',
steps:[["找谓语动词","一句话的核心是谓语，找到谓语（含时态标志）就找到了主干。"],["剥离修饰成分","把介词短语、非谓语、定语从句先圈出来放到一边。"],["还原主谓宾","主干 + 修饰一层层加回去，理解全句逻辑关系。"],["识别四大结构","定语从句、宾语从句、状语从句、非谓语，是长难句的四大常见套路。"],["刻意练习","每天拆解 2 个真题长难句，写出主谓宾和从句类型。"]],
cards:[["谓语定位法","谓语动词 = 时态标志，先圈 be / do / have 类动词。"],["从句识别","that/which/who/where/why 引导词 + 从句充当的成分。"],["非谓语三态","doing / done / to do 各自充当定语、状语、宾语等成分。"]],
practice:'每天从真题中拆解 2 个长难句，坚持 2 周，阅读速度明显提升。'},
{id:'st2', tag:'阅读理解', mins:8, title:'阅读理解：定位、精读与猜词技巧', summary:'阅读题的本质是“定位 + 同义替换”，掌握方法比盲目刷题更重要。',
steps:[["先题后文","先读题干和选项，圈出定位词（人名、数字、大写专有名词）。"],["回文比对","回原文找同义替换，警惕“偷换概念”“无中生有”的干扰项。"],["主旨看首尾","段落首句、文章首尾段承载主旨，主旨题优先在这些位置找答案。"],["猜词技巧","根据上下文线索（定义、举例、对比、因果）和构词法推断词义。"],["限时训练","每篇阅读控制在 6-7 分钟，先求准确再求速度。"]],
cards:[["同义替换库","积累题干与原文的高频替换表达。"],["干扰项类型","无中生有、偷换概念、以偏概全、过度推断。"],["猜词线索","定义、举例、对比、因果四种上下文线索。"]],
practice:'每周精做 3 篇阅读，每篇标出定位词、替换处和错误选项的类型。'},
{id:'st3', tag:'书面表达', mins:8, title:'书面表达：从模板到思维升级', summary:'写作先解决“有话说”，再解决“说得好”，模板是拐杖而不是终点。',
steps:[["审题列纲","先定体裁（书信/议论文/通知），再列三段提纲：开头、主体、结尾。"],["句式升级","简单句 → 定语从句、倒装、非谓语，每篇安排 2 个亮点句。"],["连接词串逻辑","firstly / moreover / however / in conclusion，让文章有清晰逻辑链。"],["范文仿写","先抄写背诵范文，再替换内容仿写，形成自己的模板。"],["自查清单","时态一致、主谓一致、拼写标点、字数达标，逐项检查。"]],
cards:[["亮点句式","每篇至少 2 个高级句型，宁少勿错，确保用对。"],["连接词分级","基础连接词 → 高级连接词，分层积累。"],["背诵范文","每个话题背 1 篇 80-100 词的范文。"]],
practice:'每周完整写 1 篇作文，按自查清单逐项打钩，改后重写一遍。'},
{id:'st4', tag:'听力精听', mins:7, title:'听力精听法：影子跟读与听写训练', summary:'高考听力语速快、口音杂，精听 + 跟读是唯一可靠的提升路径。',
steps:[["泛听热身","每天 15 分钟英语音频（新闻/播客）磨耳朵，培养语感。"],["精听三步","第一遍抓大意，第二遍逐句听写，第三遍对照原文订正。"],["影子跟读","比原声慢半拍跟读，训练语流、重音和反应速度。"],["考点预判","听前浏览题干，预判时间、地点、数字、人物关系等考点。"],["复盘错题","听错的句子反复听，分析是生词问题还是连读弱读问题。"]],
cards:[["听写格式","短句听写、段落听写相结合，控制每次时长。"],["连读弱读","积累 at the、in a 等高频连读弱读现象。"],["数字敏感","专门训练时间、价格、电话号码的听力。"]],
practice:'每周精听 2 段 1 分钟材料，逐句听写并跟读，记录进步曲线。'}
],
university:[
{id:'ut1', tag:'学术英语', mins:9, title:'学术英语：从课堂到论文的表达升级', summary:'大学英语的关键是学术场景：听课、讨论、写作、汇报各有规范。',

cards:[["AWL 词表","精学 570 个学术高频词，分 10 个子表推进。"],["论证结构","Claim-Evidence-Analysis 三段论证模型。"],["学术动词","argue / suggest / indicate / illustrate 等高频学术动词。"]],
practice:'每周精读 1 篇英文论文摘要，标注学术词汇和论证结构。'},
{id:'ut2', tag:'四六级备考', mins:8, title:'四六级备考：题型拆解与时间管理', summary:'四六级考的是“速度 + 精度”，按题型分配时间、专项突破。',
steps:[["摸底定位","先做一套真题，找出最弱题型，确定主攻方向。"],["听力抢分","短对话/长对话/短文/讲座各有技巧，每天保持精听。"],["阅读提速","选词填空 8 分钟、匹配 12 分钟、精读 30 分钟，严格限时。"],["翻译套路","核心句式 + 主题词汇，直译为主、适当调整语序。"],["写作模板","背熟开头-正文-结尾框架，考前默写 5 篇不同话题。"]],
cards:[["时间分配表","写作 30min、听力 30min、阅读 40min、翻译 30min。"],["高频主题词","环保、科技、教育、文化等主题词库。"],["真题复盘","每套真题做两遍，第二遍只做错题。"]],
practice:'每周 1 套真题 + 每天 30 分钟专项训练，记录各题型正确率。'},
{id:'ut3', tag:'口语进阶', mins:7, title:'口语进阶：从流利到有深度', summary:'口语不是背句子，而是练“思考 + 表达”的能力，输出倒逼输入。',
steps:[["每日输出","每天用英语自言自语 5 分钟，描述所见所感。"],["话题库练习","教育、科技、社会热点等 20 个话题，每个话题练 3 次。"],["影子跟读","跟读 TED 演讲，模仿节奏和重音，练出语流。"],["结构化表达","用 PREP 模型（观点-理由-例子-重申）组织长回答。"],["真实对话","加入语伴群或英语角，每周至少 1 次真实对话。"]],
cards:[["PREP 模型","Point-Reason-Example-Point 万能回答结构。"],["跟读选材","TED-Ed 3-5 分钟演讲，先慢速后常速。"],["录音回听","录下自己的回答，回听找卡顿和错误。"]],
practice:'本周用 PREP 模型完整回答 3 个话题，各录音 1 遍并回听修改。'},
{id:'ut4', tag:'自主学习', mins:6, title:'自主学习：语料库、播客与工具链', summary:'大学没人催你学，学会用工具和数据驱动自己持续进步。',
steps:[["语料库查询","用 COCA / BNC 查搭配和用法，让表达有据可依。"],["播客输入","选择符合水平的英文播客，通勤时间泛听。"],["英英词典","用 Longman / Oxford 等英英词典，培养英语思维。"],["错题闭环","口语录音、写作批改、听力错题全部归档复盘。"],["目标管理","用周计划设定可量化的学习目标并打卡。"]],
cards:[["播客推荐","按水平选 6 Minute English、TED、BBC 等。"],["英英词典","先看英英释义，再看例句，最后才看中文。"],["周计划模板","听说读写各 1 项 + 1 项自由任务。"]],
practice:'本周用语料库验证 5 个不确定的搭配，写进学习笔记。'}

{q:"The reason ___ he was late is that he missed the bus.", opts:["why","which","what","that"], a:0, why:"reason 后接定语从句用关系副词 why。"},

{q:"This is the village ___ I was born.", opts:["where","which","that","when"], a:0, why:"village 在从句中作地点状语，用 where。"},

/* ============ 语音播放（浏览器 TTS） ============ */
const TTS = {
  speak(text, lang, rate){
    if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音合成'); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = (rate === undefined) ? LS.voice.rate : rate;
    u.pitch = 1;
    const v = pickVoice(u.lang); if(v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  },
  en(text, rate){ this.speak(text, LS.voice.accent, rate); },
  cn(text){ this.speak(text, 'zh-CN', 1); }
};
function pickVoice(lang){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices(); if(!vs.length) return null;
  const l = lang.toLowerCase();
  return vs.find(v => v.lang.toLowerCase() === l)
      || vs.find(v => v.lang.toLowerCase().startsWith(l.split('-')[0])) || null;
}
function playWord(lv, u, i){
  const w = unitWords(lv, u).words[i];
  TTS.en(w[0] + '. ' + w[4]);
}
function playS(lv, u, i){
  const s = unitWords(lv, u).sts[i];
  TTS.en(s[0]);
}

/* ============ 标记学习 / 收藏 ============ */
function markLearned(lv, u, i){
  const k = wKey(lv, u, i);
  if(LS.learned[k]){ delete LS.learned[k]; toast('已取消“已学”标记'); }
  else { LS.learned[k] = 1; toast('已标记为已学'); }
  saveLS(); route();
}
function toggleFav(lv, u, i){
  const w = unitWords(lv, u).words[i];
  const k = wKey(lv, u, i);
  const idx = LS.favs.findIndex(f => f.k === k);
  if(idx >= 0){ LS.favs.splice(idx, 1); toast('已移出生词本'); }
  else { LS.favs.unshift({k, lv, u, i, w: w.slice(0, 6)}); toast('已加入生词本'); }
  saveLS(); route();
}

/* ============ 考试引擎 ============ */
let examTimerId = null;
function fmtTime(s){ const m = Math.floor(s/60), ss = s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function startTimer(){
  clearInterval(examTimerId);
  examTimerId = setInterval(() => {
    const e = S.exam;
    if(!e || e.mode !== 'taking'){ clearInterval(examTimerId); return; }
    e.sec = Math.floor((Date.now() - e.start)/1000);
    const el = $('#examTimer'); if(el) el.textContent = fmtTime(e.sec);
  }, 1000);
}
function startExam(){
  const levelId = S.examLevel || 'junior', diff = S.examDiff || 'basic';
  const d = DIFF[diff];
  const words = [];
  UNITS[levelId].forEach(u => u.words.forEach(w => words.push({w})));
  const cnSet = [...new Set(words.map(x => x.w[3]))];
  const used = new Set();
  const usedGram = new Set();
  function nextWord(){
    let w, tries = 0;
    do { w = words[Math.floor(Math.random()*words.length)]; tries++; } while(used.has(w.w[0]) && tries < 50);
    used.add(w.w[0]); return w;
  }
  const qs = [];
  const mk = {
    hear(){ const w = nextWord(); const opts = [w.w[3]]; while(opts.length < 3){ const o = pick(cnSet, 1); if(!opts.includes(o)) opts.push(o); } shuffle(opts); qs.push({type:'hear', word:w.w, opts, ans:opts.indexOf(w.w[3]), why:'听音识义：'+w.w[3]+'。'}); },
    ec(){ const w = nextWord(); const opts = [w.w[3]]; while(opts.length < 3){ const o = pick(cnSet, 1); if(!opts.includes(o)) opts.push(o); } shuffle(opts); qs.push({type:'ec', word:w.w, opts, ans:opts.indexOf(w.w[3]), why:'释义：'+w.w[3]+'。'}); },
    ce(){ const w = nextWord(); const opts = [w.w[0]]; while(opts.length < 3){ const o = pick(words, 1).w[0]; if(!opts.includes(o)) opts.push(o); } shuffle(opts); qs.push({type:'ce', word:w.w, opts, ans:opts.indexOf(w.w[0]), why:'对应英文：'+w.w[0]+'（/'+w.w[1]+'/）。'}); },
    gram(){ const pool = GRAM[levelId]; const slice = diff === 'basic' ? pool.slice(0,5) : diff === 'advanced' ? pool.slice(0,8) : pool; let avail = slice.filter(g => !usedGram.has(g)); if(!avail.length) avail = slice; const g = pick(avail, 1); usedGram.add(g); qs.push({type:'gram', q:g.q, opts:g.opts, ans:g.a, why:g.why}); },
    spell(){ const w = nextWord(); qs.push({type:'spell', word:w.w, cn:w.w[3], ipa:w.w[1], pos:w.w[2], ans:w.w[0], why:'拼写：'+w.w[0]+'（/'+w.w[1]+'/，'+w.w[3]+'）。'}); }
  };
  ['hear','ec','ce','gram','spell'].forEach(t => { for(let i = 0; i < d.mix[t]; i++) mk[t](); });
  shuffle(qs);
  S.exam = {mode:'taking', levelId, diff, questions:qs, answers:Array(qs.length).fill(null), ti:0, start:Date.now(), sec:0};
  route(); startTimer();
}
function answerQ(i){
  const e = S.exam; if(!e) return;
  e.answers[e.ti] = i;
  if(e.ti < e.questions.length - 1){ setTimeout(() => { e.ti++; route(); }, 320); }
  else renderTaking();
}
function checkSpell(){
  const e = S.exam; if(!e) return;
  const inp = $('#spellInput'); if(!inp) return;
  e.answers[e.ti] = inp.value.trim();
  if(e.ti < e.questions.length - 1){ setTimeout(() => { e.ti++; route(); }, 320); }
  else renderTaking();
}
function submitExam(){
  const e = S.exam; if(!e || e.mode !== 'taking') return;
  clearInterval(examTimerId);
  let correct = 0; const perType = {}, wrongs = [];
  e.questions.forEach((q, i) => {
    const a = e.answers[i]; const t = q.type;
    if(!perType[t]) perType[t] = {c:0, n:0};
    perType[t].n++;
    let ok;
    if(q.type === 'spell'){ ok = (String(a||'').toLowerCase().replace(/[^a-z\s-]/g,'') === q.word[0].toLowerCase().replace(/[^a-z\s-]/g,'')); }
    else ok = a === q.ans;
    if(ok){ correct++; perType[t].c++; }
    else wrongs.push({type:t, word:q.word?q.word[0]:'', cn:q.word?q.word[3]:'', ipa:q.word?q.word[1]:'', q:q.q, opts:q.opts, ans:q.ans, your:a, why:q.why});
  });
  const score = Math.round(correct / e.questions.length * 100);
  LS.history.push({date:Date.now(), levelId:e.levelId, diff:e.diff, score, correct, total:e.questions.length, sec:e.sec});
  if(LS.history.length > 50) LS.history = LS.history.slice(-50);
  saveLS();
  e.result = {correct, wrongs, perType, sec:e.sec};
  e.mode = 'result';
  route();
}
function restartExam(){
  S.exam = null;
  startExam();
}

/* ============ 图表（ECharts，带降级） ============ */
const CHART_COLORS = ['#1E6B5A', '#E08F2E', '#3D6FB4', '#7A5AA7', '#BC4B39'];
function chartInit(id, opt){
  const el = document.getElementById(id); if(!el) return;
  if(window.echarts){
    const c = echarts.getInstanceByDom(el) || echarts.init(el);
    c.setOption(opt, true);
    return c;
  }
  el.innerHTML = '<div style="font-size:12px;color:var(--ink-3);padding-top:6px">图表库未加载（离线时），以下为数据摘要：</div>';
}
function drawLine(){
  const hist = LS.history.slice(); // 时间正序
  if(!hist.length){ const el = $('#lineChart'); if(el) el.innerHTML = '<div class="empty" style="border:none;background:transparent"><b>暂无考试记录</b>完成一次模拟考试后显示成绩趋势</div>'; return; }
  const data = hist.map(h => h.score);
  const labels = hist.map(h => { const d = new Date(h.date); return (d.getMonth()+1)+'/'+d.getDate(); });
  const c = chartInit('lineChart', {
    grid:{left:36, right:16, top:26, bottom:28},
    xAxis:{type:'category', data:labels, axisLine:{lineStyle:{color:'#C9BFAA'}}, axisLabel:{color:'#8A948C', fontSize:11}},
    yAxis:{type:'value', min:0, max:100, axisLabel:{color:'#8A948C', fontSize:11}, splitLine:{lineStyle:{color:'#EFE8D8'}}},
    series:[{type:'line', data, smooth:true, symbol:'circle', symbolSize:7, itemStyle:{color:'#1E6B5A'}, lineStyle:{width:3, color:'#1E6B5A'}, areaStyle:{color:'rgba(30,107,90,.12)'}, markLine:{silent:true, data:[{type:'average', lineStyle:{color:'#DE8F2E', type:'dashed'}}]}}],
    tooltip:{trigger:'axis'}
  });
  if(c) c.resize();
}
function drawBar(){
  const vals = LV.map(l => { let n = 0; UNITS[l.id].forEach(u => u.words.forEach((w,i) => { if(LS.learned[wKey(l.id,u.id,i)]) n++; })); return n; });
  const c = chartInit('barChart', {
    grid:{left:36, right:16, top:26, bottom:28},
    xAxis:{type:'category', data:LV.map(l => l.name), axisLine:{lineStyle:{color:'#C9BFAA'}}, axisLabel:{color:'#8A948C', fontSize:11}},
    yAxis:{type:'value', minInterval:1, axisLabel:{color:'#8A948C', fontSize:11}, splitLine:{lineStyle:{color:'#EFE8D8'}}},
    series:[{type:'bar', data:vals.map((v,i) => ({value:v, itemStyle:{color:LV[i].c, borderRadius:[6,6,0,0]}})), barWidth:'46%', label:{show:true, position:'top', fontSize:11, color:'#5D6B64'}}],
    tooltip:{trigger:'axis'}
  });
  if(c) c.resize();
}
function drawRadar(){
  const r = S.exam && S.exam.result ? S.exam.result : null; if(!r) return;
  const items = Object.keys(r.perType);
  const c = chartInit('radarChart', {
    radar:{indicator: items.map(t => ({name:QTYPE[t][0], max:100})), radius:'62%', splitArea:{areaStyle:{color:['#FFFDF7','#F7F0DE']}}, axisName:{color:'#5D6B64', fontSize:11}},
    series:[{type:'radar', data:[{value:items.map(t => r.perType[t].n ? Math.round(r.perType[t].c/r.perType[t].n*100) : 0), name:'正确率', areaStyle:{color:'rgba(30,107,90,.25)'}, lineStyle:{color:'#1E6B5A'}, itemStyle:{color:'#1E6B5A'}}]}],
    tooltip:{}
  });
  if(c) c.resize();
}
function afterRender(p1){
  if(p1 === 'exam'){
    const e = S.exam;
    if(e && e.mode === 'taking' && e.questions[e.ti].type === 'hear'){
      setTimeout(() => { const q = S.exam.questions[S.exam.ti]; if(q && q.type === 'hear') TTS.en(q.word[0]); }, 500);
    }
    if(e && e.mode === 'result') drawRadar();
  }
  if(p1 === 'progress'){ drawLine(); drawBar(); }
}

/* ============ 词典：局部刷新（保持输入焦点） ============ */
function dictList(){
  const q = (S.dictQ || '').trim().toLowerCase();
  const flt = S.dictFlt || 'all';
  let list = allWords().filter(x => flt === 'all' || x.lv === flt);
  if(q) list = list.filter(x => x.w[0].toLowerCase().indexOf(q) >= 0 || x.w[3].indexOf(S.dictQ.trim()) >= 0 || x.w[1].indexOf(S.dictQ.trim()) >= 0);
  return q ? list : list.slice(0, 28);
}
function dictRowsHtml(list){
  if(!list.length) return '<div class="empty"><b>没有找到匹配的单词</b>换个关键词试试，比如 apple / 苹果 / æpl</div>';
  const rows = list.map(x => {
    const fav = LS.favs.some(f => f.k === x.k), done = !!LS.learned[x.k];
    const l = LVMap(x.lv);
    return '<div class="card dict-row">' +
      '<div class="d-word">'+x.w[0]+'<span class="d-ipa">/'+x.w[1]+'/</span><span class="badge green">'+x.w[2]+'</span><span class="chip lv" style="background:'+l.c+'">'+l.name+'</span></div>' +
      '<div class="d-cn">'+x.w[3]+'</div>' +
      '<div class="d-ex">'+x.w[4]+'</div><div class="d-excn">'+x.w[5]+'</div>' +
      '<div class="d-acts">' +
      '<button class="mini-btn" onclick="playWord(\''+x.lv+'\',\''+x.u+'\','+x.i+')" title="朗读">'+ico('vol')+'</button>' +
      '<button class="mini-btn '+(fav?'on':'')+'" onclick="toggleFav(\''+x.lv+'\',\''+x.u+'\','+x.i+')" title="收藏">'+ico('bookmark')+'</button>' +
      '<button class="mini-btn '+(done?'done':'')+'" onclick="markLearned(\''+x.lv+'\',\''+x.u+'\','+x.i+')" title="标记已学">'+ico('check')+'</button>' +
      '</div></div>';
  }).join('');
  return '<div class="dict-results">'+rows+'</div>';
}
function dictRefresh(){ const el = $('#dictRes'); if(el) el.innerHTML = dictRowsHtml(dictList()); }

    speechSynthesis.onvoiceschanged = function(){};

init();
